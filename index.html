<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEO-PRISM — 3D 互动数字空间</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #05070f;
      color: #ffffff;
    }
    .hero-section {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #three-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 680px;
      padding: 24px;
      pointer-events: none;
    }
    .hero-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: rgba(0, 243, 255, 0.12);
      border: 1px solid rgba(0, 243, 255, 0.35);
      color: #67e8f9;
      margin-bottom: 16px;
    }
    .hero-content h1 {
      font-size: clamp(2.2rem, 5vw, 4rem);
      margin: 0 0 16px;
      letter-spacing: -0.02em;
    }
    .hero-content p {
      font-size: 1.1rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .hero-btn {
      pointer-events: auto;
      display: inline-block;
      padding: 12px 28px;
      border-radius: 999px;
      background: linear-gradient(135deg, #00f3ff, #ff007f);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 10px 25px rgba(0, 243, 255, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .hero-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(0, 243, 255, 0.45);
    }
  </style>
</head>
<body>

  <section class="hero-section">
    <div id="three-bg"></div>

    <div class="hero-content">
      <span class="hero-badge">WEBGL 3D INTERACTIVE</span>
      <h1>探索超维数字空间</h1>
      <p>移动鼠标感受三维几何视差响应，点击下方按钮可进入完整 3D 粒子与光影控制台。</p>
      <a href="studio.html" class="hero-btn">进入 3D 交互实验室 →</a>
    </div>
  </section>

  <script>
    (function () {
      const container = document.getElementById('three-bg');
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(55, container.clientWidth / container.clientHeight, 0.1, 100);
      camera.position.z = 20;

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      container.appendChild(renderer.domElement);

      const light1 = new THREE.PointLight(0x00f3ff, 2, 50);
      light1.position.set(12, 10, 12);
      scene.add(light1);

      const light2 = new THREE.PointLight(0xff007f, 2, 50);
      light2.position.set(-12, -10, 10);
      scene.add(light2);

      const geo = new THREE.TorusKnotGeometry(4.5, 1.2, 140, 20);
      const mat = new THREE.MeshStandardMaterial({
        color: 0x00f3ff,
        emissive: 0x3b0764,
        metalness: 0.6,
        roughness: 0.25,
        wireframe: true
      });
      const mesh = new THREE.Mesh(geo, mat);
      scene.add(mesh);

      let mouseX = 0, mouseY = 0;
      window.addEventListener('pointermove', (e) => {
        mouseX = (e.clientX / window.innerWidth) * 2 - 1;
        mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
      });

      window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      });

      function animate() {
        requestAnimationFrame(animate);
        mesh.rotation.y += 0.005;
        mesh.rotation.x += (mouseY * 0.5 - mesh.rotation.x) * 0.05;
        mesh.rotation.z += (-mouseX * 0.5 - mesh.rotation.z) * 0.05;
        renderer.render(scene, camera);
      }
      animate();
    })();
  </script>
</body>
</html>
